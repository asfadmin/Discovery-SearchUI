<div class="code-wrapper">
  <div class="code-header" (click)="clipboard.onCopyIconClicked($event)">
    <span class="code-header-description"> {{ codeDescription() }} </span>
    <span class="flex-grow"></span>
    <app-copy-to-clipboard
      #clipboard
      class="compact"
      [prompt]="copyPrompt()"
      [value]="codeContent()"
      [message]="copyMessage()"
    ></app-copy-to-clipboard>
  </div>
  <code>
    <pre
      #codeBlock
      class="code"
      [class.sh]="isCommand()"
      [class.file]="!isCommand()"
    ></pre>
  </code>
</div>
