<input (change)="onFilesAdded()" class="hidden" type="file" #file />

@if ((breakpoint$ | async) > breakpoints.MOBILE) {
  <div (drop)="onFileDrop($event)" class="container file-upload--layout">
    <div class="fx-col">
      <div class="fx-empty">
        <div
          class="file-upload-target--layout"
          [class.is-file-error]="isFileError"
          [class.drop-text-box]="canBeClosed"
        >
          @if (canBeClosed) {
            <div class="drop-file-area">
              <div class="dd-text">
                <div class="dd-text-1">{{ 'DRAG_AND_DROP' | translate }}</div>
                <div class="dd-text-2">
                  {{ 'GEOSPATIAL_FILES_HERE' | translate }}
                </div>
                <div class="dd-text-3">{{ 'FILES_OPC' | translate }}</div>
              </div>
              <div class="import-button">
                <button
                  mat-raised-button
                  color="primary"
                  (click)="addFiles()"
                  [disabled]="uploading"
                >
                  {{ 'IMPORT_FILE' | translate }}
                </button>
              </div>
              <!--          <div class="actions">-->
              <!--            <button (click)="addFiles()"-->
              <!--              [disabled]="uploading"-->
              <!--              style="margin-right: 10px; margin-bottom: 10px;"-->
              <!--              color="primary" class="add-files-btn" mat-raised-button>-->
              <!--              {{'IMPORT_FILE' | translate}}-->
              <!--            </button>-->
              <!--          </div>-->
            </div>
          }
          @if (!canBeClosed) {
            <div class="loading-box">
              <div class="loading-text">
                {{ 'LOADING_FILES' | translate }}
              </div>
              <div>
                <mat-progress-spinner
                  diameter="40"
                  class="loading-spinner"
                  color="primary"
                  mode="indeterminate"
                >
                </mat-progress-spinner>
              </div>
            </div>
          }
        </div>
      </div>
    </div>
  </div>
} @else {
  <mat-button-toggle
    [matTooltip]="'UPLOAD_AOI_VIA_FILE' | translate"
    class="control-mat-button-toggle mobile-upload-button"
    [disabled]="uploading"
    (click)="addFiles()"
  >
    <mat-icon> file_upload </mat-icon>
  </mat-button-toggle>
}
