@if (submenu().length === 0) {
  <mat-icon
    (click)="onCopyIconClicked($event)"
    class="clickable icon"
    [matTooltip]="display"
    [aria-label]="display"
    matTooltipPosition="left"
    inline="true"
    [svgIcon]="svgIcon()"
  >
    @if (!svgIcon()) {
      {{ copyIcon() }}
    }
  </mat-icon>
}

@if (submenu().length > 0) {
  <mat-icon
    [matMenuTriggerFor]="promptMenu"
    class="clickable icon"
    [matTooltip]="display"
    [aria-label]="display"
    matTooltipPosition="left"
    inline="true"
  >
    {{ copyIcon() }}
  </mat-icon>

  <mat-menu #promptMenu>
    @for (item of submenu(); track item) {
      <button
        mat-menu-item
        (click)="onCopyFromMenu(item.prompt, item.message, item.value)"
      >
        {{ item.prompt }}
      </button>
    }
  </mat-menu>
}
