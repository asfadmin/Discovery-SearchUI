<hr class="content-hr" />
<mat-dialog-content class="mat-typography content-container">
  <iframe [src]="data.safeUrl" class="iframe-style"></iframe>
</mat-dialog-content>
<hr class="content-hr" />
<mat-dialog-actions align="end">
  <button mat-raised-button mat-dialog-close cdkFocusInitial>
    {{ 'CANCEL' | translate }}
  </button>
  <button mat-raised-button mat-dialog-close (click)="openDoc()">
    {{ 'OPEN_MANUAL' | translate }}
  </button>
</mat-dialog-actions>
