<h2 mat-dialog-title class="code-export-title">
    @if(codeExportType === codeExportTypes.ASF_SEARCH) {
      {{ 'ASF_SEARCH_PYTHON_EXPORT' | translate }}
    }
    @if(codeExportType === codeExportTypes.HYP3_SDK) {
      {{ 'HYP3_SDK_PYTHON_EXPORT' | translate }}
    }
</h2>

<mat-dialog-content class="code-block">
<pre #codeblock>{{codeStuff}}</pre>
</mat-dialog-content>

<mat-dialog-actions class="flex-container">
    <div class="flex-item">
      <button mat-button>
        @if(codeExportType === codeExportTypes.ASF_SEARCH) {
          <app-docs-modal url="https://docs.asf.alaska.edu/asf_search/basics/"
          text="ASF Search Docs">
          </app-docs-modal>
        }
        @if(codeExportType === codeExportTypes.HYP3_SDK) {
          <app-docs-modal url="https://hyp3-docs.asf.alaska.edu/using/sdk/"
          text="HyP3 SDK Docs">
          </app-docs-modal>
        }
      </button>
    </div>
    <div class="flex-item">
      <button mat-button mat-dialog-close>Cancel</button>
      <button mat-flat-button [mat-dialog-close]="true" cdkFocusInitial (click)="copyToClipboard()" color="primary">
        {{ 'COPY' | translate }}
      </button>
    </div>
</mat-dialog-actions>
