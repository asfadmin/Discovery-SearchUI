<form [formGroup]="stateForm">
  <mat-form-field>
    <input
      type="text"
      matInput
      placeholder="Filter Campaign"
      formControlName="missionFilter"
    />
  </mat-form-field>
</form>

@if (!!selectedMission) {
  <div class="selected" style="padding-top: 12px">
    <div style="display: flex; justify-content: space-between">
      <div>
        <span style="margin-left: 20px" class="v-mid">
          <b>{{ 'SELECTED' | translate }}</b> <span> • </span>
          {{ selectedMission }}
        </span>
      </div>
      <div>
        <mat-icon
          (click)="setMission(null)"
          style="margin-right: 10px"
          class="clickable v-mid"
          mat-list-icon
          [matTooltip]="'CLEAR_SELECTED_MISSION' | translate"
          >{{ 'CLEAR' | translate }}</mat-icon
        >
      </div>
    </div>
    <mat-divider style="margin-top: 12px" [inset]="true"></mat-divider>
  </div>
}

<cdk-virtual-scroll-viewport
  style="height: 250px"
  minBufferPx="500"
  maxBufferPx="600"
  itemSize="48"
>
  <mat-nav-list role="list">
    @for (mission of filteredMissions; track mission) {
      <div>
        <a (click)="setMission(mission)" mat-list-item role="listitem">
          {{ mission }}
        </a>
      </div>
    }
  </mat-nav-list>
</cdk-virtual-scroll-viewport>
