<span matLine class="dataset__name" [class.subName__adj]="dataset.subName">
  <b>{{ dataset.name }}</b>
  @if (dataset.beta) {
    <span><em> (beta)</em></span>
  }
  &nbsp;-&nbsp;
</span>
<span matLine>
  <span class="dataset__date" [class.subName__adj]="dataset.subName">{{
    prettyDateRange(dataset.date)
  }}</span>
  <mat-icon (click)="onOpenHelp()" class="clickable" style="margin-left: 10px"
    >info</mat-icon
  >
</span>
@if (dataset.subName) {
  <div class="dataset__subName faint-text">
    {{ dataset.subName }}
  </div>
}
