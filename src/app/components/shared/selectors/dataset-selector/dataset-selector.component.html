@if (breakpoint$ | async; as breakpoint) {
  <div>
    <div
      class="menu-button-wrapper"
      [class.mobile-button-wrapper]="breakpoint === breakpoints.MOBILE"
    >
      <mat-label class="button-label">{{ 'DATASET' | translate }}</mat-label>
      <div>
        <button
          #triggerButton
          class="button-menu-trigger"
          color="basic"
          mat-button
          [attr.aria-haspopup]="'dialog'"
          [attr.aria-expanded]="isMenuOpen"
          (click)="toggleMenu()"
        >
          <div class="button-text">
            {{ datasetNameLookup(selected) }}
            <span class="mat-select-arrow"></span>
          </div>
        </button>
        <div class="hr-wrapper"><hr class="text-underline" /></div>
      </div>
    </div>
  </div>
}
