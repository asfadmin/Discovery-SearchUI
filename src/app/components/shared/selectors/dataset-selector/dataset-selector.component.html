@if (breakpoint$ | async; as breakpoint) {
  <div>
    <div
      class="menu-button-wrapper"
      [class.mobile-button-wrapper]="breakpoint === breakpoints.MOBILE"
    >
      <mat-label class="button-label">{{ 'DATASET' | translate }}</mat-label>
      <div>
        <button
          [matMenuTriggerFor]="platformMenu"
          class="button-menu-trigger"
          color="basic"
          mat-button
        >
          <div class="button-text">
            {{ datasetName() }}
            <span class="mat-select-arrow"></span>
          </div>
        </button>
        <div class="hr-wrapper"><hr class="text-underline" /></div>
      </div>
    </div>
    <div class="gtm-search-type-selector fx-nogrow">
      <mat-menu #platformMenu="matMenu" class="dataset-selector">
        <form
          class="example-form"
          (click)="$event.stopPropagation()"
          (keydown)="$event.stopPropagation()"
        >
          <mat-form-field class="search-field" appearance="outline">
            <mat-icon matPrefix>search</mat-icon>
            <input
              matInput
              placeholder="Filter Datasets..."
              [(ngModel)]="datasetFilter"
              name="dataset-options-filter"
            />
            @if (datasetFilter()) {
              <button
                mat-icon-button
                matSuffix
                (click)="datasetFilter.set('')"
                aria-label="{{ 'CLEAR' | translate }}"
              >
                <mat-icon>clear</mat-icon>
              </button>
            }
          </mat-form-field>
        </form>
        <div class="datasets-wrapper">
          @for (
            dataset of filteredDatasets();
            track dataset;
            let isLast = $last
          ) {
            <button mat-menu-item>
              <app-dataset
                [dataset]="dataset"
                (selected)="onSelectionChange($event)"
              />
            </button>
            @if (!isLast) {
              <hr class="dataset-hr" />
            }
          }
        </div>
      </mat-menu>
    </div>
  </div>
}
