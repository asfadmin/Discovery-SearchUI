<form #eventsQueryForm="ngForm">
  <mat-form-field>
    <input
      type="text"
      placeholder="{{ 'EVENT_SEARCH' | translate }}"
      (input)="onSearchQueryChange($event)"
      matInput
      [(ngModel)]="eventQuery"
      [ngModelOptions]="{ standalone: true }"
      [matAutocomplete]="jobNameSelector"
    />
  </mat-form-field>
  <mat-autocomplete
    [panelWidth]="500"
    (optionSelected)="onMatAutoCompleteSelect($event)"
    #jobNameSelector="matAutocomplete"
  >
    @for (event of filteredEvents$ | async; track event) {
      <mat-option [value]="event.description">
        <div matTooltip="{{'EVENT_DESCRIPTION_ID_TYPE' | translate}}">
          @if (!!event.description) {
            <span>
              {{ event.description }}
            </span>
          } @else {
            <span>
              {{ event.event_type[0].toLocaleUpperCase()
              }}{{ event.event_type.slice(1) }} {{ 'EVENT' | translate }}:
              {{ event.processing_timeframe.start | shortDate }}
            </span>
          }
        </div>
      </mat-option>
    }
  </mat-autocomplete>
</form>
