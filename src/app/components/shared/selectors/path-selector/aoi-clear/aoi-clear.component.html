@if (!!polygon) {
  <button mat-stroked-button (click)="onClearSearchArea()">
    <span class="button-text">
      {{ 'CLEAR' | translate }} {{ 'AREA_OF_INTEREST' | translate }}
    </span>
  </button>
}

@if (!!savedPolygon) {
  <button mat-stroked-button (click)="undoPolygonClear()">
    <span class="button-text">
      <!--    {{ 'UNDO' | translate }} {{ 'CLEAR' | translate }} {{ 'AREA_OF_INTEREST' | translate }}-->
      <mat-icon class="undo-icon">undo</mat-icon>
      {{ 'RESTORE_AREA' | translate }}
    </span>
  </button>
}
