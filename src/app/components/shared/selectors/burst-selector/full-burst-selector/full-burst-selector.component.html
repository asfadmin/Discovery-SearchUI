@if (searchType$ | async; as type) {
  @if (type === searchTypes.DISPLACEMENT) {
    <mat-form-field class="burst-id-field">
      <mat-label>{{ 'BURST_ID_FULL' | translate }}</mat-label>
      <input
        type="text"
        matInput
        [value]="fullBurstIDs | join: ', '"
        (input)="onChange($event)"
      />
    </mat-form-field>
  } @else {
    <mat-form-field class="burst-id-field">
      <mat-label>{{ 'BURST_ID_FULL' | translate }}</mat-label>
      <textarea
        matInput
        style="height: 75px"
        [value]="fullBurstIDs | join: ', '"
        (input)="onChange($event)"
      ></textarea>
    </mat-form-field>
  }
}
