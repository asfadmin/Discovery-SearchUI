<div class="banner-title" mat-dialog-title id="deprecation-dialog-title">
  <div>Event Search Deprecation</div>
</div>
<mat-dialog-content aria-labelledby="deprecation-dialog-title">
  <div id="banner-text">
    Event search has been deprecated. Use ASF's free
    <a
      href="https://hyp3-docs.asf.alaska.edu/"
      target="_blank"
      rel="noopener noreferrer"
      aria-label="HyP3 service (opens in new tab)"
      >hyp3 service</a>
    instead to create S1 RTC and InSAR products.
  </div>
</mat-dialog-content>
<mat-dialog-actions align="end">
  <button
    mat-flat-button
    cdkFocusInitial
    [mat-dialog-close]="true"
    color="primary"
    aria-label="Close deprecation notice"
  >
    {{ 'CLOSE' | translate }}
  </button>
</mat-dialog-actions>
