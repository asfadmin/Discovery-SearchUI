<main class="welcome-demo">
  <button
    type="button"
    class="welcome-demo__close"
    aria-label="Cerrar bienvenida y continuar"
    (click)="close()"
  >
    <span aria-hidden="true">→</span>
  </button>

  <div class="sparkles" aria-hidden="true">
    <span class="sparkle sparkle-1"></span>
    <span class="sparkle sparkle-2"></span>
    <span class="sparkle sparkle-3"></span>
    <span class="sparkle sparkle-4"></span>
    <span class="sparkle sparkle-5"></span>
  </div>

  <section class="envelope-scene" aria-label="Welcome envelope animation">
    <div class="letter">
      <div class="letter__content">
        <p class="letter__eyebrow">Una bienvenida especial</p>
        <h1>Qué emoción, bienvenida a tu nuevo espacio</h1>
        <p class="letter__hint">Cierra el sobre y continúa para explorar.</p>
      </div>
    </div>

    <div class="envelope">
      <div class="envelope__lid"></div>
      <div class="envelope__fold envelope__fold--left"></div>
      <div class="envelope__fold envelope__fold--right"></div>
      <div class="envelope__base"></div>
      <div class="envelope__seal">ECLEA</div>
    </div>
  </section>
</main>
