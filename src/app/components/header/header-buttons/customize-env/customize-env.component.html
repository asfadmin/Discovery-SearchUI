<div class="dialog-header">
  <div mat-dialog-title>{{ 'CUSTOMIZE_ENVIRONMENTS' | translate }}</div>
</div>

<mat-dialog-content class="h100 w100">
  <mat-slide-toggle
    style="margin-right: 16px; padding-bottom: 16px"
    (change)="onValidateOnlyToggle($event.checked)"
    [(ngModel)]="env.validateOnlyHyp3"
  >
  Validate Only HyP3
  </mat-slide-toggle>

  <form #envForm="ngForm">
    <mat-form-field class="w100">
      <mat-label>{{ 'ENVIRONMENT_FILE' | translate }}</mat-label>
      <textarea
        [(ngModel)]="envStr"
        name="environFile"
        [cdkTextareaAutosize]="true"
        matInput
      ></textarea>
    </mat-form-field>
  </form>
</mat-dialog-content>
<mat-dialog-actions>
  <button mat-flat-button (click)="resetToDefaultEnv()">
    {{ 'RESET_TO_DEFAULT' | translate }}
  </button>
  <button mat-flat-button (click)="setCustomEnv()" color="primary">
    {{ 'SET' | translate }}
  </button>
</mat-dialog-actions>
