@if (breakpoint$ | async; as breakpoint) {
  @if (breakpoint > breakpoints.MOBILE) {
    <div class="breadcrumb-row fx-row">
      <div class="fx-row">
        <app-search-type-selector class="breadcrumb">
        </app-search-type-selector>
        <div class="breadcrumb additional-filters">
          <button
            (click)="onToggleFiltersMenu()"
            mat-flat-button
            class="search-dialog-button"
          >
            <mat-icon>edit_list</mat-icon>
            {{ 'EDIT_LIST' | translate }}
          </button>
        </div>
        <div class="breadcrumb search-controls">
          <app-search-button></app-search-button>
        </div>
      </div>
    </div>
  }
  @if (breakpoint === breakpoints.MOBILE) {
    <div>
      <div class="mobile-nav-bar">
        <button
          (click)="onToggleFiltersMenu()"
          class="mobile-filters-button"
          mat-flat-button
        >
          <mat-icon>edit</mat-icon>
          {{ 'LIST' | translate }}
        </button>
      </div>
    </div>
  }
}
