<ng-container *ngIf="breakpoint$ | async as breakpoint">
	<div *ngIf="breakpoint > breakpoints.MOBILE" class="breadcrumb-row baseline-header-layout">
		<div class="baseline-header-wrapper">
			<app-search-type-selector *ngIf="!(isKioskMode$ | async)" class="breadcrumb" style="margin-right: 16px;">
			</app-search-type-selector>

      <div class="displacement-header-menu">
        <app-draw-selector></app-draw-selector>
        <app-timeseries-chart-flight-direction-toggle></app-timeseries-chart-flight-direction-toggle>
        <app-search-button></app-search-button>
      </div>

			<div class="icon-cluster">
				<app-header-buttons>
				</app-header-buttons>
			</div>
		</div>
	</div>
</ng-container>
