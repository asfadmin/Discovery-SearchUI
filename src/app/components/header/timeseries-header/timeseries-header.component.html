<ng-container *ngIf="breakpoint$ | async as breakpoint">
	<div *ngIf="breakpoint > breakpoints.MOBILE" class="breadcrumb-row baseline-header-layout">
		<div class="baseline-header-wrapper">
			<app-search-type-selector *ngIf="!(isKioskMode$ | async)" class="breadcrumb">
			</app-search-type-selector>

      <div class="displacement-header-menu">
        @if(!isAddingPoints) {
          <button mat-button (click)="onAddPointsMode()"><mat-icon>add_location_alt</mat-icon>{{ 'ADD_POINTS' | translate }}</button>
        }
        @else {
          <button mat-button (click)="onStopAddPoints()"><mat-icon>location_off</mat-icon>{{ 'STOP_ADDING_POINTS' | translate }}</button>
        }

        <button mat-button>
          <app-timeseries-chart-flight-direction-toggle></app-timeseries-chart-flight-direction-toggle>
        </button>

        <button mat-button [matMenuTriggerFor]="savedTools">Search Tools</button>
        <mat-menu #savedTools="matMenu">
          <button mat-menu-item>Saved Searches</button>
          <button mat-menu-item>Share Search</button>
        </mat-menu>
      </div>
