@if (breakpoint$ | async; as breakpoint) {
  @if (breakpoint !== breakpoints.MOBILE) {
    <div (click)="onResetSearch()" class="bounds clickable fx-row">
      <mat-card class="content logo-card mat-elevation-z10">
        <div class="branding-block">
          <img
            src="/assets/asf-logos/vertex/asf-vertex-outline.png"
            class="asf-logo"
          />
        </div>
      </mat-card>
    </div>
  }
  @if (breakpoint === breakpoints.MOBILE) {
    <div (click)="onResetSearch()" class="clickable">
      <img src="/assets/ASFLogo-Blue2.png" class="asf-logo-mobile" />
    </div>
  }
}
