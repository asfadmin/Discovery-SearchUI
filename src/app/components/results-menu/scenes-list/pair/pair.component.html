<button
  class="button-flex-row pair-row"
  mat-list-item
  (click)="onPairSelected(pair)"
  (mouseenter)="onSetHovered()"
  (mouseleave)="onClearHovered()"
  [class.selected]="
    selectedPair
      ? pair[0].id + pair[1].id === selectedPair[0] + selectedPair[1]
      : false
  "
  [class.hovered]="hovered"
>
  <span matListItemTitle
    >{{ pair[0].metadata.date | shortDate }} to
    {{ pair[1].metadata.date | shortDate }}</span
  >

  <div class="date" matListItemMeta>{{ pairPerpBaseline(pair) }}m</div>
  <div class="date" matListItemMeta>{{ pairTempBaseline(pair) }}d</div>

  @if (hyp3able.total > 0) {
    <mat-icon
      class="clickable noselect list-icon"
      style="margin-left: 10px"
      matTooltip="{{ 'ADD_PAIR_TO_ON_DEMAND_QUEUE' | translate }}"
      [matMenuTriggerFor]="pairAdd.addMenu"
      [matMenuTriggerData]="{ hyp3able: hyp3able.byJobType }"
      svgIcon="hyp3"
      matListItemMeta
    >
    </mat-icon>
  }

  @if (hyp3able.total < 1) {
    @let isS1DPair =
      (this.pair[0].dataset === 'SENTINEL-1D' ||
        this.pair[1].dataset === 'SENTINEL-1D') &&
      this.pair[0].metadata.productType === 'BURST';
    <mat-icon
      class="noselect list-icon"
      style="margin-left: 10px; opacity: 0.5"
      matTooltip="{{
        (isS1DPair ? 'S1D_ISCE_DISABLED' : 'ONLY_CO-POLARIZED_BURSTS')
          | translate
      }}"
      svgIcon="hyp3"
      matListItemMeta
    >
    </mat-icon>
  }

  <app-on-demand-add-menu #pairAdd> </app-on-demand-add-menu>
</button>
