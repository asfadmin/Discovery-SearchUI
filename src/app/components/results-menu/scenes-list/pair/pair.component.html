<button
  class="button-flex-row pair-row"
  mat-list-item
  (click)="onPairSelected(pair())"
  (mouseenter)="onSetHovered()"
  (mouseleave)="onClearHovered()"
  [class.selected]="isSelected()"
  [class.hovered]="hovered"
>
  <span matListItemTitle
    >{{ pair()[0].metadata.date | shortDate }} to
    {{ pair()[1].metadata.date | shortDate }}</span
  >

  <div class="date" matListItemMeta>{{ pairPerpBaseline() }}m</div>
  <div class="date" matListItemMeta>{{ pairTempBaseline() }}d</div>

  @if (hyp3ableFiltered().total > 0) {
    <mat-icon
      class="clickable noselect list-icon icon-margin"
      matTooltip="{{ 'ADD_PAIR_TO_ON_DEMAND_QUEUE' | translate }}"
      [matMenuTriggerFor]="pairAdd.addMenu"
      [matMenuTriggerData]="{ hyp3able: hyp3ableFiltered().byJobType }"
      svgIcon="hyp3"
      matListItemMeta
    >
    </mat-icon>
  }

  @if (hyp3ableFiltered().total < 1) {
    <mat-icon
      class="noselect list-icon icon-margin icon-disabled"
      matTooltip="{{ 'ONLY_CO_POLARIZED_BURSTS' | translate }}"
      svgIcon="hyp3"
      matListItemMeta
    >
    </mat-icon>
  }

  <app-on-demand-add-menu #pairAdd> </app-on-demand-add-menu>
</button>
