<div class="gdal-dataset" [aria-label]="gdalDataset().name">
  <span class="gdal-dataset-name">
    {{ gdalDataset().name | translate }}
  </span>
  @if (gdalDataset().unit) {
    <span class="gdal-dataset-chip">
      {{ gdalDataset().unit }}
    </span>
  }
  @if (gdalDataset().type) {
    <span class="gdal-dataset-chip">
      {{ gdalDataset().type }}
    </span>
  }
  <span class="flex-grow"></span>
  <span class="icon-row">
    <app-copy-to-clipboard
      class="compact"
      [prompt]="'EXPORT_DATASET_LINK_CLIPBOARD' | translate"
      [aria-label]="'EXPORT_DATASET_LINK_CLIPBOARD' | translate"
      [value]="downloadURL()"
      [message]="'EXPORTED_DATASET_LINK_CLIPBOARD' | translate"
      copyIcon="link"
    ></app-copy-to-clipboard>
    <app-copy-to-clipboard
      class="compact"
      [prompt]="'EXPORT_DATASET_PATH_CLIPBOARD' | translate"
      [aria-label]="'EXPORT_DATASET_PATH_CLIPBOARD' | translate"
      [value]="gdalDataset().path"
      [message]="'EXPORTED_DATASET_PATH_CLIPBOARD' | translate"
    ></app-copy-to-clipboard>
    <app-copy-to-clipboard
      class="compact"
      [prompt]="'EXPORT_GDAL_CLIPBOARD' | translate"
      [aria-label]="'EXPORT_DATASET_PATH_CLIPBOARD' | translate"
      [value]="gdalCommand()"
      [message]="'EXPORTED_GDAL_CLIPBOARD' | translate"
      copyIcon="terminal_alt"
    ></app-copy-to-clipboard>
  </span>
</div>
