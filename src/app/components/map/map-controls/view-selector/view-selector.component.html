<div class="projection-container">
  @if (!isDisplacementSearch) {
    <button
      mat-stroked-button
      (click)="onArcticSelected()"
      class="view-select-button clickable"
      [class.selected]="view === types.ARCTIC"
      [value]="types.ARCTIC"
      [attr.aria-label]="'ARCTIC_MAP_PROJECTION' | translate"
      matTooltip="{{ 'ARCTIC_MAP_PROJECTION' | translate }}"
    >
      <mat-icon svgIcon="arctic" class="view-btn view-select-icon"> </mat-icon>
    </button>
  }

  <button
    mat-stroked-button
    (click)="onEquatorialSelected()"
    class="view-select-button clickable"
    [class.selected]="view === types.EQUATORIAL && !isDisplacementSearch"
    [attr.aria-label]="'EQUATORIAL_MAP_PROJECTION' | translate"
    matTooltip="{{ 'EQUATORIAL_MAP_PROJECTION' | translate }}"
    [value]="types.EQUATORIAL"
  >
    <mat-icon svgIcon="equatorial" class="view-btn view-select-icon">
    </mat-icon>
  </button>

  @if (!isDisplacementSearch) {
    <button
      mat-stroked-button
      (click)="onAntarcticSelected()"
      class="view-select-button clickable"
      [class.selected]="view === types.ANTARCTIC"
      [attr.aria-label]="'ANTARCTIC_MAP_PROJECTION' | translate"
      [value]="types.ANTARCTIC"
      matTooltip="{{ 'ANTARCTIC_MAP_PROJECTION' | translate }}"
    >
      <mat-icon
        svgIcon="antarctic"
        class="view-btn view-select-icon"
      ></mat-icon>
    </button>
  }
</div>
