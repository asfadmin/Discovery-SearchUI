<div class="projection-container">
  <button
    mat-stroked-button
    (click)="onArcticSelected()"
    class="view-select-button"
    [class.selected]="view === types.ARCTIC"
    [class.clickable]="view !== types.ARCTIC && !isDisplacementSearch"
    [class.unavailable-view]="isDisplacementSearch"
    [attr.aria-disabled]="isDisplacementSearch"
    [value]="types.ARCTIC"
    [attr.aria-label]="arcticLabel | translate"
    [matTooltip]="arcticLabel | translate"
  >
    <mat-icon svgIcon="arctic" class="view-btn view-select-icon"> </mat-icon>
  </button>

  <button
    mat-stroked-button
    (click)="onEquatorialSelected()"
    class="view-select-button"
    [class.selected]="view === types.EQUATORIAL && !isDisplacementSearch"
    [class.clickable]="view !== types.EQUATORIAL && !isDisplacementSearch"
    [attr.aria-label]="'EQUATORIAL_MAP_PROJECTION' | translate"
    [matTooltip]="'EQUATORIAL_MAP_PROJECTION' | translate"
    [value]="types.EQUATORIAL"
  >
    <mat-icon svgIcon="equatorial" class="view-btn view-select-icon">
    </mat-icon>
  </button>

  <button
    mat-stroked-button
    (click)="onAntarcticSelected()"
    class="view-select-button"
    [class.selected]="view === types.ANTARCTIC"
    [class.clickable]="view !== types.ANTARCTIC && !isDisplacementSearch"
    [class.unavailable-view]="isDisplacementSearch"
    [attr.aria-disabled]="isDisplacementSearch"
    [attr.aria-label]="antarcticLabel | translate"
    [value]="types.ANTARCTIC"
    [matTooltip]="antarcticLabel | translate"
  >
    <mat-icon svgIcon="antarctic" class="view-btn view-select-icon"></mat-icon>
  </button>
</div>
