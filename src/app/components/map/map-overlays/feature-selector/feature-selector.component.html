<mat-action-list class="multi-frame">
  @for (feature of this.features(); track $index) {
    <li>
      <button
        (click)="handleClick(feature)"
        matButton
        (mouseenter)="hoverPreview(feature)"
        (mouseleave)="hoverPreviewLeave(feature)"
      >
        Select:
        <!-- TODO: Figure out a better way of representing feature properties -->
        <!-- TODO: also bring in the filename component? -->
        {{
          (feature.get('filename') | slice: 0 : 20) ??
            `Frame ID ${feature.get('id')}`
        }}
      </button>
    </li>
  }
</mat-action-list>
