<div cdkDragHandle class="draggable feature-header">
  <h3 class="feature-options-title">
    {{ 'SELECT_FROM_OVERLAPPING' | translate }}
  </h3>
  <button matIconButton (click)="closeMenu()">x</button>
</div>
<hr class="divider" />
<div class="feature-options">
  <mat-action-list class="feature-options-list">
    @for (item of this.displayedFeatures(); track $index) {
      <mat-list-item
        (click)="handleClick(item.feature)"
        (mouseenter)="hoverPreview(item.feature)"
        (mouseleave)="hoverPreviewLeave(item.feature)"
      >
        <span matListItemTitle>
          {{ item.display }}
        </span>
      </mat-list-item>
    }
  </mat-action-list>
</div>
