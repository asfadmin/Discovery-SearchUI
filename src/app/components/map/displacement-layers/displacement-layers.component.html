<div class="disp-layers--layout position" cdkDrag>
  <div class="layers-selector fx-col">

    <mat-checkbox [value]="DispLayerTypes.VELOCITY"
                  [checked]="this.displacementOverview === DispLayerTypes.VELOCITY"
                  (change)="onToggleVelocityLayerDisplay($event.checked)"
    >
      <div class="selector-text">
        {{ 'VELOCITY' | translate}} 2016-2025
        <div class="material-symbols-outlined displacement-info-icon"
             matTooltip="Info about <a href='https://www.w3schools.com/'>link</a>the action">
          help
        </div>
      </div>
    </mat-checkbox>

    @if (this.displacementOverview === DispLayerTypes.VELOCITY) {
      <div style="margin-top: -5px;">
        <app-map-legend
          style="display: inline-block; margin-top: -5px;"
          [min]="this.mapService.displacementRange?.range[0]"
          [max]="this.mapService.displacementRange?.range[1]"
          [units]="this.mapService.displacementRange?.units">
        </app-map-legend>
      </div>
    }

    <mat-checkbox #priorityRollout class="rollout-checkbox"
    (change)="onUpdatePriority($event.checked)"
    [checked]="priorityEnabled">
      <div class="selector-text">
        {{ 'ROLLOUT' | translate}}
      </div>
    </mat-checkbox>

    @if (priorityEnabled) {
      <div class="priority-legend">
        <div class="priority-box first-priority">1st</div>
        <div class="priority-box second-priority">2nd</div>
        <div class="priority-box third-priority">3rd</div>
      </div>
    }

<!--    <div class="help-text">-->
<!--      {{ 'WHAT_ARE_THESE?' | translate}}-->
<!--      <app-docs-modal class="info-icon" url="https://docs.asf.alaska.edu/vertex/displacement/#map-layers">-->
<!--      </app-docs-modal>-->
<!--    </div>-->

    <div class="footer">
      <div class="footer--text container space-between">
        <div>
<!--          {{ 'HELP' | translate}}-->
          <app-docs-modal class="info-icon"
                          custStyle="color: #ffffffb3; cursor: pointer; text-decoration: underline;"
                          text="{{ 'HELP' | translate}}"
                          url="https://docs.asf.alaska.edu/vertex/displacement/#map-layers"
          >
          </app-docs-modal>
        </div>
        <div>{{ 'MAP_LAYERS' | translate}}</div>
      </div>
    </div>

  </div>

</div>
