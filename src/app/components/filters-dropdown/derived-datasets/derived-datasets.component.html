@if (breakpoint$ | async; as breakpoint) {
  <div>
    <button
      [matMenuTriggerFor]="derivedDatasetMenu"
      class="spacing nav-icon-buttons"
      color="basic"
      matTooltip="{{ 'ON_DEMAND_QUEUE' | translate }}"
      mat-button
    >
      <div class="text-under faint-text">
        {{ 'DERIVED_DATASETS' | translate }}...
      </div>
    </button>

    <mat-menu #derivedDatasetMenu="matMenu">
      @for (dataset of datasets; track dataset.name) {
        <div
          mat-menu-item
          matSuffix
          (click)="onOpenDerivedDataset(dataset.info_url, dataset.name)"
        >
          @if (breakpoint === breakpoints.MOBILE) {
            <div>
              <mat-icon>video_library</mat-icon>
              {{ dataset.name }}
            </div>
          } @else {
            <div class="menu-item">
              <div fxFlex="" class="menu-item-content">
                <div class="item-title">{{ dataset.name }}</div>
                <div class="item-content">
                  {{ dataset.description | translate }}
                </div>
              </div>
              <div fxFlex="" class="menu-item-aside">
                <img [src]="dataset.picture" class="menu-item-icon" />
              </div>
            </div>
          }

          <mat-card-actions>
            <button
              (click)="onOpenDerivedDataset(dataset.info_url, dataset.name)"
              mat-button
              class="link-button"
            >
              {{ 'MORE_INFO' | translate }}
            </button>
            <button
              (click)="onOpenDerivedDataset(dataset.download_url, dataset.name)"
              mat-button
              class="link-button"
            >
              {{ 'DOWNLOAD' | translate }}
            </button>
          </mat-card-actions>
          <hr class="dataset-hr" />
        </div>
      }
    </mat-menu>
  </div>
}
