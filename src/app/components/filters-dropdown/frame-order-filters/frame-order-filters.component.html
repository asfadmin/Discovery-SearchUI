@if ((dataset() | isRelevant: p.PATH) || (dataset() | isRelevant: p.FRAME)) {
  <mat-expansion-panel
    [expanded]="defaultPanelOpenState"
    [disabled]="panelIsDisabled"
    (click)="selectPanel(panels.PATH)"
    [class.raised-section]="isSelected(panels.PATH)"
  >
    <mat-expansion-panel-header
      [collapsedHeight]="customCollapsedHeight"
      [expandedHeight]="customExpandedHeight"
    >
      <mat-panel-title class="panel-title">
        {{ 'FRAME_ORDER_FILTERS' | translate }}
        <app-docs-modal
          class="info-icon"
          url="https://docs.asf.alaska.edu/vertex/manual/#path-and-frame-filters"
        >
        </app-docs-modal>
      </mat-panel-title>
    </mat-expansion-panel-header>
    <div class="selector-card-spacing">
      <app-path-selector> {{ 'TO' | translate }}</app-path-selector>
    </div>
    <app-flight-direction-selector
      [multiple]="false"
    ></app-flight-direction-selector>
  </mat-expansion-panel>
}
