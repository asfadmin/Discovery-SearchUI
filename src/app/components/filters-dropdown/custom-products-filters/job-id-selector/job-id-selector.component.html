<mat-form-field class="job-id-selector">
  <mat-label>{{ 'JOB_IDS_SELECTOR' | translate }}</mat-label>
  <textarea
    type="text"
    name="jobIdsInput"
    matInput
    cdkTextareaAutosize
    #autosize="cdkTextareaAutosize"
    cdkAutosizeMinRows="1"
    cdkAutosizeMaxRows="10"
    (change)="onJobIdsChange($event)"
    [(ngModel)]="jobIds"
  >
  </textarea>
</mat-form-field>
