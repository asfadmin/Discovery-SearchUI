<mat-accordion multi>
  <mat-expansion-panel
    [expanded]="defaultPanelOpenState"
    [disabled]="panelIsDisabled"
    (click)="selectPanel(panels.SEARCH)"
    [class.raised-section]="isSelected(panels.SEARCH)"
  >
    <mat-expansion-panel-header
      [collapsedHeight]="customCollapsedHeight"
      [expandedHeight]="customExpandedHeight"
    >
      <mat-panel-title>
        {{ panels.SEARCH | translate }}
      </mat-panel-title>
    </mat-expansion-panel-header>

    <div class="search-options-row">
      <app-search-type-selector class="selector-spacing-right">
      </app-search-type-selector>

      <app-on-demand-user-selector
        class="selector-top-offset"
      ></app-on-demand-user-selector>

      <app-job-id-selector
        [jobIds]="hyp3JobIds"
        (newJobIds)="onNewHyp3JobIds($event)"
        class="selector-top-offset"
      ></app-job-id-selector>
    </div>
  </mat-expansion-panel>

  <mat-expansion-panel
    [expanded]="defaultPanelOpenState"
    [disabled]="panelIsDisabled"
    (click)="selectPanel(panels.DATE_FILTER)"
    [class.raised-section]="isSelected(panels.DATE_FILTER)"
  >
    <mat-expansion-panel-header
      [collapsedHeight]="customCollapsedHeight"
      [expandedHeight]="customExpandedHeight"
    >
      <mat-panel-title>
        {{ 'DATE_FILTERS' | translate }}
      </mat-panel-title>
    </mat-expansion-panel-header>

    <div class="selector-card-spacing">
      <app-date-selector></app-date-selector>
    </div>
  </mat-expansion-panel>

  <mat-expansion-panel
    [expanded]="defaultPanelOpenState"
    [disabled]="panelIsDisabled"
    (click)="selectPanel(panels.PROJECT_NAME)"
    [class.raised-section]="isSelected(panels.PROJECT_NAME)"
  >
    <mat-expansion-panel-header
      [collapsedHeight]="customCollapsedHeight"
      [expandedHeight]="customExpandedHeight"
    >
      <mat-panel-title>
        {{ 'JOB_FILTERS' | translate }}
      </mat-panel-title>
    </mat-expansion-panel-header>

    <div class="w100 job-filters-row">
      <div class="w100 job-filters-row">
        <app-project-name-selector
          class="selector-spacing-right"
        ></app-project-name-selector>
        <app-job-status-selector></app-job-status-selector>
      </div>
      <app-job-product-name-selector
        [headerView]="false"
      ></app-job-product-name-selector>
    </div>
  </mat-expansion-panel>
</mat-accordion>
